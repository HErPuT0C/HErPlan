[package]
name = "herplan-proto-tauri"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
