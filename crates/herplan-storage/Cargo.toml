[package]
name = "herplan-storage"
version = "0.7.5"
description = "Project storage for HErPlan: project folders, atomic writes, backups and archives (ADR-004)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Deleted assets go to the Recycle Bin (freedesktop trash on Linux). Pinned: it calls the Windows shell.
trash = "=5.2.6"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
