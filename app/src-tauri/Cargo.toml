[package]
name = "herplan"
version = "0.7.1"
description = "HErPlan desktop application"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "herplan_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
herplan-storage = { path = "../../crates/herplan-storage" }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
os_info = { version = "3.15.0", default-features = false }
# Arguments of `asset_write` travel in request headers, which carry ASCII only (already in the tree via tauri).
percent-encoding = "2.3.2"
