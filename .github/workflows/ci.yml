# HErPlan application: checks on every push; the Windows installer on main, on demand and for releases.
# Releases are started by a person (agent sessions cannot push tags), either way:
#   - GitHub → Releases → Draft a new release → Publish: the installer is built and attached to that release;
#   - Actions → ci → Run workflow → tick "publish": a pre-release is created with the installer.
name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['prototypes/**', '.github/workflows/prototypes.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as a GitHub pre-release
        type: boolean
        default: false
      tag:
        description: Release tag to create (for example v0.1.0)
        type: string
        default: v0.1.0-dev

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Versions agree (package, lock, Tauri, Cargo)
        run: node scripts/check-version.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (Chromium, web build)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Canvas benchmark numbers (software WebGL, for trends only)
        if: always()
        run: |
          if [ -f test-results/canvas-bench.json ]; then
            echo '### Canvas benchmark (SwiftShader, 5 000 nodes)' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./test-results/canvas-bench.json');console.log('| phase | fps | p95 ms |\n|---|---|---|\n'+r.phases.map(p=>'| '+p.id+' | '+p.fps+' | '+p.p95+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-bench
          path: app/test-results/canvas-bench.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          retention-days: 7
          path: app/playwright-report

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the interface (the Rust shell embeds it)
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  crash-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Kill the process 200 times while it saves; the project must open every time (NFR-06)
        shell: bash
        run: cargo run --release -p herplan-storage --example crashtest -- run "$RUNNER_TEMP/crash" 200 | tee crashtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashtest-${{ matrix.os }}
          path: crashtest.json
          retention-days: 14

  windows-installer:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: [web, rust, crash-test]
    runs-on: windows-latest
    env:
      # Builds between releases carry the run number (About shows "сборка N"); release builds do not.
      HERPLAN_BUILD: ${{ github.event_name != 'release' && github.run_number || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The release tag names the app version
        if: github.event_name == 'release'
        run: node app/scripts/check-version.mjs "${{ github.event.release.tag_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $name = if ($env:HERPLAN_BUILD) { "HErPlan-$version-build$($env:HERPLAN_BUILD)" } else { "HErPlan-$version" }
          Copy-Item $setup.FullName "dist-installer/$name-setup.exe"
          Get-ChildItem dist-installer | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}-installer
          retention-days: 30
          path: dist-installer
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist-installer/*.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --prerelease --title "HErPlan ${{ inputs.tag }}" `
            --notes "Сборка для проверки. Если Windows покажет предупреждение SmartScreen: «Подробнее» → «Выполнить в любом случае»."
      - name: Attach the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload $env:TAG dist-installer/*.exe --clobber --repo $env:GITHUB_REPOSITORY
          $notes = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body
          $howto = "Установка: скачайте HErPlan-…-setup.exe ниже и запустите. Если Windows покажет «Windows защитил ваш компьютер»: «Подробнее» → «Выполнить в любом случае». Архивы Source code — исходный код, для установки они не нужны."
          if (-not ($notes -like "*setup.exe*")) {
            Set-Content -Path notes.md -Value ($howto + "`n`n" + $notes) -Encoding utf8
            gh release edit $env:TAG --notes-file notes.md --repo $env:GITHUB_REPOSITORY
          }
