# HErPlan application: checks on every push; the Windows installer on main or on demand.
# Releases are started by a person: Actions → ci → Run workflow → tick "publish" (agent sessions cannot push tags).
name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['prototypes/**', '.github/workflows/prototypes.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as a GitHub pre-release
        type: boolean
        default: false
      tag:
        description: Release tag to create (for example v0.1.0)
        type: string
        default: v0.1.0-dev

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (Chromium, web build)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          retention-days: 7
          path: app/playwright-report

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the interface (the Rust shell embeds it)
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-installer:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [web, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          Copy-Item $setup.FullName "dist-installer/HErPlan-$version-setup.exe"
          Get-ChildItem dist-installer | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: HErPlan-installer
          retention-days: 30
          path: dist-installer
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist-installer/*.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --prerelease --title "HErPlan ${{ inputs.tag }}" `
            --notes "Сборка для проверки. Если Windows покажет предупреждение SmartScreen: «Подробнее» → «Выполнить в любом случае»."
