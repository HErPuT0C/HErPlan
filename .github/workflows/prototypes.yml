# Phase F0 prototypes: build the web prototype, wrap it in Tauri (ADR-001), measure it on Windows.
# Artifacts expire on their own (retention-days): intermediate ones after 1–2 weeks, installers after 30 days.
# A tag like proto-v0.0.1 also publishes the installers and measurements as a GitHub pre-release.
name: prototypes

on:
  push:
    branches: [main, 'f0/**']
    paths: ['prototypes/**', '.github/workflows/prototypes.yml']
    tags: ['proto-v*']
  # Releases are published by a person: Actions → prototypes → Run workflow → tick "publish".
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers as a GitHub pre-release
        type: boolean
        default: false
      tag:
        description: Release tag to create
        type: string
        default: proto-v0.0.1

permissions:
  contents: write

# A newer push waits for the running measurement instead of cancelling it half-way.
concurrency:
  group: prototypes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Headless smoke run (editor round trip, autobench, screenshots)
        run: |
          npx playwright install --with-deps chromium
          mkdir -p bench-results
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/smoke.mjs http://localhost:4173/ bench-results | tee bench-results/summary.txt
      - name: Markdown round-trip fuzz of the prototype (informational; the app's own fuzzer is required in ci.yml)
        continue-on-error: true
        run: node scripts/fuzz-markdown.mjs http://localhost:4173/ 40 60 | tee bench-results/fuzz-markdown.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          retention-days: 7
          path: prototypes/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          retention-days: 14
          path: prototypes/web/bench-results

  expr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/expr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Text is extractable and embeds are resolved
        run: |
          sudo apt-get install -y poppler-utils > /dev/null
          pdfinfo out/sample.pdf
          test "$(pdftotext out/sample.pdf - | grep -o 'Мира' | wc -l)" -ge 20
          ! pdftotext out/sample.pdf - | grep -q 'ent:'
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-sample
          retention-days: 14
          path: prototypes/pdf/out/sample.pdf

  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototypes/storage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/storage
      - run: cargo test --release
      - run: cargo build --release --bin crashtest
      - name: Crash test (atomic writes, 200 kills)
        shell: bash
        run: ./target/release/crashtest run crash-atomic 200 | tee crashtest-atomic.json
      - name: Control group (naive overwrite, 100 kills, expected to corrupt)
        shell: bash
        run: ./target/release/crashtest run-naive crash-naive 100 | tee crashtest-naive.json
      - name: Project layout benchmark (100 000 objects)
        shell: bash
        run: |
          cargo build --release --bin formatbench
          ./target/release/formatbench formatbench-data | tee formatbench.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-${{ matrix.os }}
          retention-days: 14
          path: |
            prototypes/storage/crashtest-*.json
            prototypes/storage/formatbench.json

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: prototypes/web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/shell-tauri/src-tauri

      - name: Build Tauri installer
        working-directory: prototypes/shell-tauri
        run: |
          npm ci
          npx tauri build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installers | Out-Null
          $tauri = Get-ChildItem prototypes/shell-tauri/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $tauri.FullName dist-installers/HErPlan-prototype-setup.exe
          Get-ChildItem dist-installers | Format-Table Name, Length

      - name: Measure Tauri
        shell: pwsh
        run: ./prototypes/ci/measure.ps1 -Name tauri -Installer dist-installers/HErPlan-prototype-setup.exe -DisplayName "HErPlan Proto Tauri" -OutDir results

      - name: Summary
        shell: pwsh
        run: |
          node prototypes/ci/summarize.mjs results/tauri.json | Tee-Object -FilePath results/summary.md
          Get-Content results/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: HErPlan-prototype-installer
          retention-days: 30
          path: |
            dist-installers
            results

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/proto-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          $notes = @"
          Прототип фазы Ф0 (не продукт). На вкладке «Холст» нажмите «Запустить все замеры» (около минуты, мышь не трогать), затем пришлите текст со вкладки «Отчёт».

          Windows может показать «Windows защитил ваш компьютер»: установщики не подписаны. Нажмите «Подробнее» → «Выполнить в любом случае».

          ## Замеры CI
          "@
          $notes += "`n" + (Get-Content results/summary.md -Raw)
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG dist-installers/*.exe results/*.json `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
            --title "Прототипы Ф0 ($env:RELEASE_TAG)" --notes-file release-notes.md
